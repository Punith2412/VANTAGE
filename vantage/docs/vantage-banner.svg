  <rect x="540" y="40" width="12" height="100" rx="2" fill="#3fb950" opacity="0.85"/>
  <rect x="560" y="75" width="12" height="65" rx="2" fill="#d29922" opacity="0.8"/>
  <rect x="580" y="50" width="12" height="90" rx="2" fill="#58a6ff" opacity="0.7"/>
  <rect x="600" y="85" width="12" height="55" rx="2" fill="#3fb950" opacity="0.75"/>
  <rect x="620" y="35" width="12" height="105" rx="2" fill="#58a6ff" opacity="0.95"/>
</svg>
