# Optional: Render Blueprint (you can also configure everything in the dashboard)
services:
  - type: web
    name: vantage
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
